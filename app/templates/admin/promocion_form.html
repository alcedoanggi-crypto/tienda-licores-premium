{% extends "admin/base_admin.html" %}
{% set titulo_pagina = "Nueva promoción" %}
{% block titulo %}Nueva promoción · Panel administrativo{% endblock %}

{% block contenido %}
<div class="panel-admin" style="max-width: 640px;">
  <form method="POST">
    <div class="row g-3">
      <div class="col-md-8">
        <label class="form-label">Nombre</label>
        <input type="text" name="nombre" class="form-control" required>
      </div>
      <div class="col-md-4">
        <label class="form-label">Código</label>
        <input type="text" name="codigo" class="form-control text-uppercase" placeholder="VERANO25" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Tipo</label>
        <select name="tipo" class="form-select">
          <option value="porcentaje">Porcentaje (%)</option>
          <option value="monto_fijo">Monto fijo ($)</option>
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">Valor</label>
        <input type="number" step="0.01" name="valor" class="form-control" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Categoría (opcional)</label>
        <select name="categoria_id" class="form-select">
          <option value="">Todas</option>
          {% for c in categorias %}
          <option value="{{ c.id }}">{{ c.nombre }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label">Desde</label>
        <input type="date" name="fecha_inicio" class="form-control" required>
      </div>
      <div class="col-md-3">
        <label class="form-label">Hasta</label>
        <input type="date" name="fecha_fin" class="form-control" required>
      </div>
    </div>
    <div class="mt-4 d-flex gap-2">
      <button type="submit" class="btn btn-dorado"><i class="bi bi-check-lg"></i> Crear promoción</button>
      <a href="{{ url_for('admin.promociones_listar') }}" class="btn btn-outline-dorado">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
